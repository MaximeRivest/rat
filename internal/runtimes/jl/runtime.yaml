name: jl
display: Julia

detect:
  commands: [julia]
  env: RAT_JULIA

kernel:
  type: json
  script: kernel.jl
  # Output streams live on the kernel's stdout/stderr; cancel interrupts
  # the running code and keeps the session.
  transport: socket
  interrupt: signal

# rat jl: Julia's own REPL (modes, history, Unicode completion), its
# code evaluated in the shared kernel (frontend.jl).
frontend:
  type: native
  command: "julia -i --startup-file=no --banner=no {config_dir}/frontend.jl {mcp_url} {name}"
  fallback:
    type: repl
    prompt: "julia> "

install:
  runtime:
    manager: none
  smoke:
    run: "1 + 1"
    expect: "2"

# rat.julia.dependencies in a notebook: checked, installed and locked by
# packages.jl (see internal/notebook/runtimeenv.go for the contract).
packages:
  key: julia
  script: packages.jl
  args: ["--startup-file=no"]
