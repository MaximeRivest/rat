name: r
display: R

detect:
  commands: [Rscript, R]
  env: RAT_R
  # Where R installers put it (the CRAN installers, rig, Homebrew).
  paths:
    - /usr/local/bin/Rscript
    - /opt/homebrew/bin/Rscript
    - /Library/Frameworks/R.framework/Resources/bin/Rscript
    - $ProgramFiles/R/R-*/bin/Rscript
    - $LOCALAPPDATA/Programs/R/R-*/bin/Rscript

kernel:
  type: json
  script: kernel.R
  args: ["--no-save", "--no-restore"]
  # Output streams live on the kernel's stdout/stderr; cancel interrupts
  # the running code and keeps the session.
  transport: socket
  interrupt: signal

frontend:
  type: repl
  prompt: "r> "

install:
  runtime:
    manager: r
    deps: [jsonlite]
  smoke:
    run: "1 + 1"
    expect: "2"

# rat.r.dependencies in a notebook: checked, installed and locked by
# packages.R (see internal/notebook/runtimeenv.go for the contract).
packages:
  key: r
  script: packages.R
  args: ["--no-save", "--no-restore"]
